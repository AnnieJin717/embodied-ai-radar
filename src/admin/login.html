<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 具身项目雷达</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f5;color:#213c32;font:15px "Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{background:white;border:1px solid #d9e4df;border-radius:12px;padding:32px;max-width:460px;width:100%;box-shadow:0 12px 35px #2545370b}h1{font-size:23px;margin:0 0 12px}p{font-size:13px;line-height:1.9;color:#738279}label{display:block;margin-top:20px;font-size:13px}input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #c9d7cf;border-radius:6px;font:inherit}button{font:inherit;cursor:pointer}#submit{margin-top:24px;background:#24765f;color:white;border:0;border-radius:6px;padding:12px;width:100%}#submit:disabled{opacity:.6}#error{color:#aa3d39;min-height:24px;font-size:13px;white-space:pre-wrap}#toggle{background:none;border:0;padding:10px 0;color:#486a59;font-size:12px}small{color:#82948a;line-height:1.8;display:block}</style></head>
<body><main><button id="language" type="button">English</button><h1 data-i="具身项目雷达 · 管理员|Embodied AI Radar · Admin">具身项目雷达 · 管理员</h1><p data-i="本地测试登录。请保持 CMD 启动窗口打开，使用该窗口当前显示的 Password。每次重新启动，自动生成的密码可能变化。|Keep the startup window open and use the password displayed there. A new password may be generated each time the application starts.">本地测试登录。请保持 CMD 启动窗口打开，使用该窗口当前显示的 Password。每次重新启动，自动生成的密码可能变化。</p>
<form id="login"><label for="username" data-i="用户名|Username">用户名</label><input id="username" name="username" value="tester" maxlength="80" autocomplete="username" required>
<label for="password" data-i="密码|Password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="toggle" type="button">显示密码</button>
<div id="error" role="status" aria-live="polite"></div><button id="submit" type="submit" data-i="登录管理员系统|Sign in">登录管理员系统</button></form><p data-i="登录失败会在本页提示，不会关闭页面。若提示连接中断，请检查 CMD 窗口。|If the connection is interrupted, check the startup window.">登录失败会在本页提示，不会关闭页面。若提示连接中断，请检查 CMD 窗口。</p><small data-i="版本：网页登录修复版 · 会话有效期 8 小时|Sessions expire after eight hours.">版本：网页登录修复版 · 会话有效期 8 小时</small></main>
<script>
const form=document.getElementById('login'),button=document.getElementById('submit'),error=document.getElementById('error'),password=document.getElementById('password');
let en=false;
try{en=localStorage.getItem("admin-language")==="en"}catch{}
const L=(zh,english)=>en?english:zh;
const toggle=document.getElementById("toggle"),language=document.getElementById("language");
function renderLanguage(){
 document.documentElement.lang=en?"en":"zh-CN";
 document.title=L("登录 · 具身项目雷达","Sign in · Embodied AI Radar");
 document.querySelectorAll("[data-i]").forEach(n=>n.textContent=n.dataset.i.split("|")[en?1:0]);
 toggle.textContent=password.type==="password"?L("显示密码","Show password"):L("隐藏密码","Hide password");
 language.textContent=en?"Chinese":"English";
}
language.onclick=()=>{en=!en;try{localStorage.setItem("admin-language",en?"en":"zh")}catch{} error.textContent="";renderLanguage()};
toggle.onclick=()=>{password.type=password.type==="password"?"text":"password";renderLanguage()};
renderLanguage();
form.onsubmit=async e=>{
 e.preventDefault();button.disabled=true;error.textContent=L("正在登录…","Signing in\u2026");
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
  const res=await fetch('/admin/api/login',{method:'POST',credentials:'same-origin',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:password.value})});
  const answer=await res.json();
  if(!res.ok){error.textContent=res.status===401?L("用户名或密码不正确。请使用当前启动窗口中的密码。","Incorrect username or password. Use the password in the current startup window."):(answer.error||L("登录失败，请重试。","Sign-in failed. Please try again."));return}
  const session=await fetch('/admin/api/session',{credentials:'same-origin',cache:'no-store',signal:controller.signal});
  if(!session.ok){error.textContent=L("浏览器未保存登录状态。请允许此本地网站使用 Cookie，或用 Edge / Chrome 打开当前 URL。","Your browser did not save the session. Allow cookies for this site or open this URL in Edge or Chrome.");return}
  error.textContent=L("登录成功，正在打开工作台…","Signed in. Opening the admin dashboard\u2026");location.replace('/admin');
 }catch{error.textContent=L("连接中断或超时。请保持 CMD 窗口打开，并复制该窗口的最新 URL 重新访问。","Connection lost or timed out. Keep the startup window open and use the latest URL displayed there.")}
 finally{clearTimeout(timer);button.disabled=false}
};
</script></body></html>
